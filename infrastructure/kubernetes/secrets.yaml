apiVersion: v1
kind: Secret
metadata:
  name: nexusops-secrets
  namespace: nexusops
type: Opaque
stringData:
  # Replace these demo values before using a shared or production cluster.
  SECRET_KEY: "change-me-in-production"
  JWT_SECRET_KEY: "change-me-in-production-jwt-secret"
  DATABASE_URL: "postgresql+asyncpg://nexusops:nexusops_secret@postgres:5432/nexusops"
  REDIS_URL: "redis://redis:6379/0"
  CELERY_BROKER_URL: "redis://redis:6379/1"
  CELERY_RESULT_BACKEND: "redis://redis:6379/2"
  OPENAI_API_KEY: ""
