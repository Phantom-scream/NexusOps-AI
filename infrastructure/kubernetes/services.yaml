apiVersion: v1
kind: Service
metadata:
  name: nexusops-api
  namespace: nexusops
spec:
  selector:
    app: nexusops-api
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexusops-ingress
  namespace: nexusops
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: nexusops.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: nexusops-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexusops-frontend
                port:
                  number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nexusops-frontend
  namespace: nexusops
spec:
  selector:
    app: nexusops-frontend
  ports:
    - port: 80
      targetPort: 80
