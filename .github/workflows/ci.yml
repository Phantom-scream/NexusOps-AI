name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexusops
          POSTGRES_PASSWORD: nexusops_secret
          POSTGRES_DB: nexusops_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check app tests

      - name: Compile backend
        run: python -m compileall app tests alembic

      - name: Type check with mypy
        run: mypy app --ignore-missing-imports
        continue-on-error: true

      - name: Validate migrations
        env:
          DATABASE_URL: postgresql+asyncpg://nexusops:nexusops_secret@localhost:5432/nexusops_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-32-characters-long
          APP_ENV: testing
        run: alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://nexusops:nexusops_secret@localhost:5432/nexusops_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-32-characters-long
          APP_ENV: testing
        run: pytest tests/ -v --cov=app --cov-report=xml

      - name: Run API smoke tests
        env:
          DATABASE_URL: postgresql+asyncpg://nexusops:nexusops_secret@localhost:5432/nexusops_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-32-characters-long
          APP_ENV: testing
        run: >
          pytest
          tests/test_auth.py
          tests/test_infrastructure_discovery.py::test_demo_generate_and_topology_api
          tests/test_telemetry.py::test_demo_telemetry_api_and_cluster_filters
          tests/test_investigations.py::test_investigation_api_demo_flow
          tests/test_terraform_analysis.py::test_terraform_api_demo_analysis_flow
          tests/test_optimization.py::test_optimization_api_demo_flow
          -q

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
        continue-on-error: true

  frontend:
    name: Frontend — Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  deployment-validation:
    name: Deployment Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build backend production image
        run: docker build --target production -t nexusops-api:ci ./backend

      - name: Build frontend production image
        run: docker build --target production -t nexusops-frontend:ci ./frontend
